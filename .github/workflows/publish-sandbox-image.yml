# Publishes the redistributable sandbox BASE image to ghcr.io.
#
#   ghcr.io/rbcodelabs/claude-threads-sandbox:<sandbox/IMAGE_VERSION>
#   ghcr.io/rbcodelabs/claude-threads-sandbox:sha-<git sha>
#
# What is (and is not) in the image: sandbox/Dockerfile only (Node 22, git,
# ripgrep, jq, ...). The Claude CLI is deliberately NOT included — Claude Code
# has no redistribution grant. The plugin pulls this image and then builds a
# tiny local layer (sandbox/Dockerfile.harness) that installs the CLI on the
# user's own machine. See src/sandboxImage.ts.
#
# Versioning is decoupled from plugin releases: sandbox/IMAGE_VERSION is a small
# integer, bumped ONLY when sandbox/Dockerfile changes, and it must match
# SANDBOX_IMAGE_VERSION in src/sandboxImage.ts (a unit test enforces this).
# A published :<version> tag is immutable — this workflow refuses to overwrite
# it — so publish the image (merge the Dockerfile + IMAGE_VERSION bump) before
# shipping a plugin release that references the new version.
#
# Apple silicon only, so linux/arm64 only, built natively on GitHub's free
# arm64 runner (the repo is public).
#
# ONE-TIME MANUAL STEP (repo owner only): GitHub creates new ghcr packages as
# PRIVATE. After the first successful run, open
#   https://github.com/orgs/rbcodelabs/packages/container/claude-threads-sandbox/settings
# (or the user-level equivalent) and set "Change package visibility" to Public.
# Until then anonymous pulls fail with "unauthorized" for everyone else.
name: Publish sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'sandbox/Dockerfile'
      - 'sandbox/IMAGE_VERSION'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sandbox-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rbcodelabs/claude-threads-sandbox

jobs:
  publish:
    name: Build and push linux/arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read image version
        id: version
        run: |
          version="$(tr -d '[:space:]' < sandbox/IMAGE_VERSION)"
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "::error file=sandbox/IMAGE_VERSION::Expected a positive integer, got '$version'"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Published tags are immutable. `imagetools inspect` exits 0 iff the tag
      # exists; a non-zero exit is only "safe to publish" when the registry
      # says the manifest is absent, so an auth/network error fails loudly
      # instead of silently allowing an overwrite.
      - name: Refuse to overwrite an existing version tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "::error file=sandbox/IMAGE_VERSION::${IMAGE}:${VERSION} already exists. Published tags are immutable - bump sandbox/IMAGE_VERSION (and SANDBOX_IMAGE_VERSION in src/sandboxImage.ts) when sandbox/Dockerfile changes."
            exit 1
          fi
          if grep -qiE 'not found|manifest unknown|name unknown|404' <<<"$out"; then
            echo "${IMAGE}:${VERSION} does not exist yet; publishing."
          else
            echo "::error::Could not determine whether ${IMAGE}:${VERSION} exists:"
            echo "$out"
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox
          file: sandbox/Dockerfile
          platforms: linux/arm64
          push: true
          # buildx attaches provenance/SBOM attestations by default, which turns the
          # tag into a multi-entry manifest. Apple's `container image pull` of that
          # is unproven, and published tags are immutable (a bad first publish could
          # only be fixed by bumping the version), so keep the first publish a plain
          # single-platform image. Revisit once a real pull has been verified.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.rbcodelabs.claude-threads.image-version=${{ steps.version.outputs.value }}

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published sandbox image"
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Also tagged: \`sha-${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: \`linux/arm64\`"
            echo
            echo "First publish? Set the package visibility to **Public** in the GitHub UI, or pulls fail for everyone else."
          } >> "$GITHUB_STEP_SUMMARY"
