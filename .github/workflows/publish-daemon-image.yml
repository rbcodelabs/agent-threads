# Publishes the agent-threads DAEMON image to ghcr.io on a release tag.
#
#   ghcr.io/rbcodelabs/agent-threads-daemon:<version>      (the tag without its leading "v")
#   ghcr.io/rbcodelabs/agent-threads-daemon:sha-<git sha>
#
# What is (and is not) in the image: sandbox/Dockerfile.daemon's `base` stage: Node 22, git, gh, ripgrep, jq,
# build-essential and the daemon bundle. The Claude CLI is deliberately NOT included: Claude Code has no
# redistribution grant. Users add it on their own machine with the
# `with-claude` stage (see the Dockerfile header and docs/remote-daemon.md), or build the whole thing from the
# repository, which installs it at build time.
#
# Triggered by the same `v*` tag that creates the plugin release, so the daemon and the plugin it talks to are
# version-locked (the daemon refuses a plugin older than its minClientVersion). It does not run on branches: a manual
# dispatch is honoured only from a tag or from main (job-level guard below), and then only for a version whose
# `v<version>` tag already exists, so a feature branch can never push an image to the registry.
#
# ONE-TIME MANUAL STEP (repo owner only): GitHub creates new ghcr packages as PRIVATE. After the first successful
# run, open the package settings for agent-threads-daemon under the organisation's Packages and set "Change
# package visibility" to Public. Until then anonymous pulls fail with "unauthorized" for everyone else.
name: Publish daemon image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish as (without the leading v)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-daemon-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rbcodelabs/agent-threads-daemon

jobs:
  publish:
    name: Build and push linux/amd64 + linux/arm64
    # Never publish from an arbitrary branch, even when someone dispatches the workflow from one.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js (runs scripts/smoke-daemon.mts)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Expected a semantic version, got '$version'"
            exit 1
          fi
          manifest="$(jq -r '.version' manifest.json)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::manifest.json is at $manifest but the image would be tagged $version"
            exit 1
          fi
          # A manual run (from main) may only publish a version that was already tagged.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
              echo "::error::No tag v${version} exists; a manual run only publishes an already-tagged release."
              exit 1
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Published tags are immutable: refuse to overwrite one. `imagetools inspect` exits 0 iff the tag exists; a
      # non-zero exit only counts as "absent" when the registry says so, so an auth/network error fails loudly.
      - name: Refuse to overwrite an existing version tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "::error::${IMAGE}:${VERSION} already exists. Published tags are immutable; cut a new version."
            exit 1
          fi
          if grep -qiE 'not found|manifest unknown|name unknown|404' <<<"$out"; then
            echo "${IMAGE}:${VERSION} does not exist yet; publishing."
          else
            echo "::error::Could not determine whether ${IMAGE}:${VERSION} exists:"
            echo "$out"
            exit 1
          fi

      # Prove the image works BEFORE pushing: build the native platform, start it with the scripted fake harness
      # and run the same smoke script operators run (health, bad-token rejection, a short stream).
      - name: Build locally and smoke-test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sandbox/Dockerfile.daemon
          target: base
          load: true
          provenance: false
          sbom: false
          tags: agent-threads-daemon-smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:7433:7433 agent-threads-daemon-smoke:test \
            --listen 0.0.0.0 --i-know-this-is-open --workspace /srv/workspaces --fake-harness
          token="$(docker exec smoke agent-threads token create --name smoke --scope admin --json | jq -r .token)"
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy
          docker exec smoke gh --version
          docker exec smoke git --version
          docker exec smoke rg --version
          npm ci --ignore-scripts --no-audit --no-fund
          AGENT_THREADS_SMOKE_URL=http://127.0.0.1:7433 AGENT_THREADS_SMOKE_TOKEN="$token" node scripts/smoke-daemon.mts
          docker rm -f smoke

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sandbox/Dockerfile.daemon
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published daemon image"
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Also tagged: \`sha-${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Contains the Claude CLI: no (add it with the \`with-claude\` stage)"
            echo
            echo "First publish? Set the package visibility to **Public** in the GitHub UI, or pulls fail for everyone else."
          } >> "$GITHUB_STEP_SUMMARY"
