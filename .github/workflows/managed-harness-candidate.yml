name: Claude and Antigravity harness candidates

on:
  pull_request:
    paths:
      - sandbox/harness-versions.json
      - sandbox/Dockerfile.daemon
      - scripts/managed-harness-versions.mjs
      - scripts/claude-candidate-smoke.mjs
      - scripts/codex-candidate-smoke.mjs
      - test/integration/managed-harness-versions.test.mjs
      - .github/workflows/managed-harness-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Claude and Antigravity binaries (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test test/integration/managed-harness-versions.test.mjs
      - run: docker build -f sandbox/Dockerfile.daemon -t candidate-claude .
      - run: docker build -f sandbox/Dockerfile.daemon --target with-harnesses --build-arg INSTALL_ANTIGRAVITY=1 -t candidate-agy .
      - name: Stream and cold-resume with Claude Code
        run: |
          version="$(node -p "require('./sandbox/harness-versions.json').claude")"
          docker run --rm --network none --entrypoint node \
            --mount "type=bind,source=$PWD/scripts,target=/smoke,readonly" \
            candidate-claude /smoke/claude-candidate-smoke.mjs "$version"
      - run: |
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"clientCapabilities":{}}}'; sleep 3; } |
            timeout 30 docker run --rm --network none -i --entrypoint agy candidate-agy acp |
            jq -es 'any(.[]; .id == 1 and .result.protocolVersion == 1)'
