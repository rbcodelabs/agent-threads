name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          TAG="${{ github.ref_name }}"
          MANIFEST=$(jq -r '.version' manifest.json)
          if [ "v${MANIFEST}" != "${TAG}" ]; then
            echo "❌ manifest.json version (${MANIFEST}) does not match tag (${TAG})"
            echo "Run: npm version ${TAG#v} then push the bump commit before tagging."
            exit 1
          fi
          echo "✅ manifest.json version (${MANIFEST}) matches tag (${TAG})"

      - name: Build
        run: npm run build

      - name: Verify versions.json is in sync
        # This used to *mutate* versions.json here and ship the result as an
        # asset without ever committing it back, so the repo copy drifted --
        # by v0.27.10 it was missing 106 released versions going back to 0.1.0.
        # versions.json is now maintained in the repo (npm run sync-versions,
        # wired into `npm version`), and this step only guards it.
        run: node scripts/sync-versions.mts --check

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Auto-generated release assets." \
            dist/main.js \
            dist/main.mobile.js \
            dist/styles.css \
            manifest.json \
            versions.json \
          || gh release upload "${{ github.ref_name }}" \
            --clobber \
            dist/main.js \
            dist/main.mobile.js \
            dist/styles.css \
            manifest.json \
            versions.json
